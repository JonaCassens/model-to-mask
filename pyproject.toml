[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-to-mask"
version = "0.1.0"
description = "Initial scaffold for a model-to-mask neural ASIC compiler pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
m2m-init = "model_to_mask.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
